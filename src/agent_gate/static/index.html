<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>agent-gate</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: #fff;
      color: #111;
      font: 14px system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.45;
    }
    main { max-width: 52rem; margin: 1.25rem auto 3rem; padding: 0 1rem; }
    h1 { font-size: 16px; font-weight: 600; margin: 0 0 0.75rem; }
    p.note { color: #555; margin: 0 0 1rem; }
    label { display: block; margin: 0.75rem 0 0.3rem; }
    textarea, input[type="date"] {
      font: inherit;
      width: 100%;
      border: 1px solid #ccc;
      background: #fff;
      color: #111;
      padding: 0.4rem 0.5rem;
    }
    textarea { min-height: 9rem; resize: vertical; }
    .dates { display: flex; gap: 1rem; }
    .dates > div { flex: 1; }
    .providers { display: flex; flex-wrap: wrap; gap: 0.85rem; margin: 0.35rem 0 1rem; }
    .providers label { display: inline; margin: 0; }
    button {
      font: inherit;
      border: 1px solid #333;
      background: #f2f2f2;
      color: #111;
      padding: 0.4rem 0.85rem;
      cursor: pointer;
    }
    button:hover { background: #e6e6e6; }
    button:disabled { color: #777; cursor: default; }
    #status { min-height: 1.2rem; color: #555; margin: 0.7rem 0 0; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 0.35rem 0.5rem;
      text-align: left;
      vertical-align: top;
      font-size: 13px;
    }
    th { background: #f4f4f4; font-weight: 600; }
    tfoot td { background: #f7f7f7; font-weight: 600; }
    td.err { color: #a40000; }
  </style>
</head>
<body>
  <main>
    <h1>API Key 额度</h1>
    <p class="note">每行一把 Key。可写 <code>openrouter:</code> / <code>deepseek:</code> / <code>openai:</code> 前缀，或靠 <code>sk-or-</code> 自动识别。提交后只显示掩码，不保存 Key。</p>
    <label for="keys">API keys</label>
    <textarea id="keys" spellcheck="false" autocomplete="off"></textarea>
    <div class="dates">
      <div>
        <label for="from">开始</label>
        <input id="from" type="date">
      </div>
      <div>
        <label for="to">结束</label>
        <input id="to" type="date">
      </div>
    </div>
    <label>平台</label>
    <div class="providers">
      <label><input type="checkbox" name="provider" value="openrouter" checked> OpenRouter</label>
      <label><input type="checkbox" name="provider" value="deepseek" checked> DeepSeek</label>
      <label><input type="checkbox" name="provider" value="openai" checked> OpenAI</label>
    </div>
    <label><input type="checkbox" id="insecure"> 跳过证书校验</label>
    <button type="button" id="run">统计额度</button>
    <p id="status"></p>
    <table id="out" hidden>
      <thead>
        <tr>
          <th>平台</th>
          <th>密钥</th>
          <th>余额或用量</th>
          <th>费用</th>
          <th>说明</th>
        </tr>
      </thead>
      <tbody></tbody>
      <tfoot></tfoot>
    </table>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);

    function iso(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return y + "-" + m + "-" + day;
    }

    function defaultRange() {
      const to = new Date();
      const from = new Date();
      from.setDate(from.getDate() - 30);
      $("from").value = iso(from);
      $("to").value = iso(to);
    }

    function selectedProviders() {
      return Array.from(document.querySelectorAll('input[name="provider"]:checked')).map((el) => el.value);
    }

    $("run").addEventListener("click", async () => {
      const keys = $("keys").value;
      $("status").textContent = "查询中";
      $("run").disabled = true;
      try {
        const res = await fetch("/api/usage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            keys,
            from: $("from").value,
            to: $("to").value,
            providers: selectedProviders(),
            insecure: $("insecure").checked,
          }),
        });
        const data = await res.json();
        $("keys").value = "";
        if (!res.ok || data.ok === false) {
          throw new Error(data.error || ("请求失败 " + res.status));
        }
        const tbody = $("out").querySelector("tbody");
        tbody.innerHTML = "";
        (data.rows || []).forEach((row) => {
          const tr = document.createElement("tr");
          const note = row.error || row.note || "";
          const cells = [row.provider, row.masked, row.amount || "—", row.cost || "—", note];
          cells.forEach((text, i) => {
            const td = document.createElement("td");
            td.textContent = text || "—";
            if (i === 4 && row.error) td.className = "err";
            tr.appendChild(td);
          });
          tbody.appendChild(tr);
        });
        const tfoot = $("out").querySelector("tfoot");
        tfoot.innerHTML = "";
        const addFoot = (label, amount, cost, note) => {
          const tr = document.createElement("tr");
          const lab = document.createElement("td");
          lab.colSpan = 2;
          lab.textContent = label;
          tr.appendChild(lab);
          [amount || "—", cost || "—", note || ""].forEach((text) => {
            const td = document.createElement("td");
            td.textContent = text;
            tr.appendChild(td);
          });
          tfoot.appendChild(tr);
        };
        const totals = data.totals || {};
        (data.subtotals || []).forEach((item) => {
          addFoot(item.label || ("小计 " + (item.provider || "")), item.amount, item.cost, "");
        });
        addFoot(data.totals_label || "合计", totals.amount, totals.cost, data.totals_note || "");
        $("out").hidden = false;
        $("status").textContent = (data.rows || []).length ? "" : "没有可查询的 Key。";
      } catch (err) {
        $("keys").value = "";
        let msg = String(err.message || err);
        if (/CERTIFICATE_VERIFY_FAILED|certificate verify failed|self-signed certificate|_ssl\.c/i.test(msg)) {
          msg = "公司代理/自签名证书时勾选「跳过证书校验」或设环境变量。";
        }
        $("status").textContent = msg;
      } finally {
        $("run").disabled = false;
      }
    });

    defaultRange();
  </script>
</body>
</html>
