[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-gate"
version = "0.2.0"
description = "Paste API keys, query usage/quota per key, and show totals."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "agent-gate contributors" }]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
agent-gate = "agent_gate.cli:console_main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_gate"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
